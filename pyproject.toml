[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "Security and governance control plane for autonomous AI agents: policy engine, audit log, approval queue, kill switch."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Emir Perla", email = "emirperla96@gmail.com"}
]
keywords = ["AI", "agents", "guardrails"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "typer[all]>=0.9",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.42b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
agentguard = "agentguard.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: typer.Option(...) in argument defaults IS the documented Typer pattern.
ignore = ["B008"]
