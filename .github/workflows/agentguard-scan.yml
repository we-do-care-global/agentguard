name: AgentGuard Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run AgentGuard scan and check
        run: |
          # Run scanner and capture output
          python agentguard.py scan . --format json > scan-results.json || true
          
          # Check if file exists and has content
          if [ ! -f scan-results.json ]; then
            echo "ERROR: scan-results.json not created"
            exit 1
          fi
          
          # Check file size
          size=$(wc -c < scan-results.json)
          echo "scan-results.json size: $size bytes"
          
          if [ "$size" -eq 0 ]; then
            echo "WARNING: scan-results.json is empty"
            echo "[]" > scan-results.json
          fi
          
          # Check for critical issues
          CRITICAL=$(python -c "
import json
with open('scan-results.json') as f:
    issues = json.load(f)
critical = [i for i in issues if i['severity'] == 'critical']
print(len(critical))
")
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Found $CRITICAL critical security issues"
            exit 1
          fi
          
          echo "Scan passed: $CRITICAL critical issues found"

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: agentguard-scan-results
          path: scan-results.json
